name: Release

on:
  release:
    types: [published]

jobs:
  docker-release:
    uses: cloudoperators/common/.github/workflows/shared-docker-release.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      image-name: ghcr.io/cloudoperators/repo-guard
      environment: release

  helm-release:
    uses: cloudoperators/common/.github/workflows/shared-helm-release.yaml@main
    permissions:
      contents: read
      packages: write
    with:
      chart-dir: charts/repo-guard
      chart-name: repo-guard
      environment: release
